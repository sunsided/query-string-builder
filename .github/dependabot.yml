---
version: 2

updates:
  # Keeps the SHA-pinned actions and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before proposing them, so a compromised release
    # has time to be noticed and yanked.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Dependabot does not tell Cargo dev-dependencies apart, so group the
    # test and benchmark tooling by name; everything else falls through.
    groups:
      cargo-dev-dependencies:
        patterns: ["criterion", "proptest"]
      cargo-dependencies:
        patterns: ["*"]
