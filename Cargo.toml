[package]
name = "query-string-builder"
description = "A query string builder for percent encoding key-value pairs"
authors = ["Markus Mayer"]
version = "0.7.1"
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/sunsided/query-string-builder"
keywords = ["url", "query-string", "query-argument"]
categories = ["web-programming::http-client"]
readme = "README.md"
license = "EUPL-1.2"

[features]
default = ["alloc"]
# QueryStringOwned, Vec-backed pair storage and rendering into a String.
alloc = []

[dependencies]
percent-encoding = { version = "2.3.2", default-features = false }

[dev-dependencies]
criterion = "0.5.1"
percent-encoding = "2.3.2"
proptest = "1"

[[test]]
name = "allocations"
required-features = ["alloc"]

[[test]]
name = "properties"
required-features = ["alloc"]

[[bench]]
name = "bench"
harness = false
required-features = ["alloc"]
